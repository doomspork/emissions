name: Dependency advisories
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix escript.install hex mix_audit --force
      - run: ~/.mix/escripts/mix_audit
